name: build-test-deploy

on: push

jobs:
  build:
    runs-on: ubuntu-ltest

    steps:
      - name: checkout repos
        uses: actions/checkout@v4
      - name: use node.js
        uses: actions/step-node@v4
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run build
